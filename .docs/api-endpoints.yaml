openapi: 3.0.0
info:
  title: Ecommerce Platform API
  version: 1.0.0
paths:
  /api/v1/home:
    get:
      summary: Fetch Home Data
      description: Trả về toàn bộ dữ liệu cần thiết (Banners, Categories, Featured Products, Social Proof) để render Frontend ngay lập tức.
      operationId: getHomeData
      tags:
        - Home
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      heroBanners:
                        type: array
                        items:
                          type: object
                      featuredCategories:
                        type: array
                        items:
                          type: object
                      featuredProducts:
                        type: array
                        items:
                          type: object
                      socialProof:
                        type: object
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Không thể tải dữ liệu trang chủ lúc này. Vui lòng thử lại sau.
                  code:
                    type: string
                    example: INTERNAL_SERVER_ERROR
      x-implementation:
        filePath: apps/backend/src/modules/home/home.controller.ts

  /api/v1/products:
    get:
      summary: Lấy danh sách sản phẩm
      description: Lấy danh sách sản phẩm, hỗ trợ Query Params để lọc và sắp xếp.
      operationId: getProducts
      tags:
        - Products
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: categoryId
          in: query
          schema:
            type: string
        - name: minPrice
          in: query
          schema:
            type: number
        - name: maxPrice
          in: query
          schema:
            type: number
        - name: sortBy
          in: query
          schema:
            type: string
            default: latest
      responses:
        '200':
          description: OK
      x-implementation:
        filePath: apps/backend/src/modules/products/products.controller.ts

  /api/v1/categories:
    get:
      summary: Lấy danh sách danh mục
      description: Lấy danh sách Category (dạng list) để render bộ lọc bên trái.
      operationId: getCategories
      tags:
        - Categories
      responses:
        '200':
          description: OK
      x-implementation:
        filePath: apps/backend/src/modules/categories/categories.controller.ts

  /api/v1/banners:
    get:
      summary: Lấy danh sách banner
      description: Lấy danh sách banner theo vị trí.
      operationId: getBanners
      tags:
        - Banners
      parameters:
        - name: position
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
      x-implementation:
        filePath: apps/backend/src/modules/banners/banners.controller.ts

  /api/v1/products/suggest:
    get:
      summary: Lấy danh sách sản phẩm gợi ý
      description: Trả về danh sách tối đa 5 sản phẩm khớp với từ khóa tìm kiếm.
      operationId: suggestProducts
      tags:
        - Products
      parameters:
        - name: keyword
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 5
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        price:
                          type: number
                        image:
                          type: string
        '500':
          description: Internal Server Error
      x-implementation:
        filePath: apps/backend/src/modules/products/products.controller.ts

  /api/v1/auth/register:
    post:
      summary: Đăng ký tài khoản
      description: Đăng ký tài khoản khách hàng mới.
      operationId: register
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                email:
                  type: string
                phone:
                  type: string
                password:
                  type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                      accessToken:
                        type: string
                      refreshToken:
                        type: string
        '400':
          description: Bad Request (Validation failed)
        '409':
          description: Conflict (Email already exists)
      x-implementation:
        filePath: apps/backend/src/modules/auth/auth.controller.ts

  /api/v1/auth/login:
    post:
      summary: Đăng nhập tài khoản
      description: Đăng nhập tài khoản khách hàng.
      operationId: login
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                      accessToken:
                        type: string
                      refreshToken:
                        type: string
        '400':
          description: Bad Request (Validation failed)
        '401':
          description: Unauthorized (Incorrect email or password)
      x-implementation:
        filePath: apps/backend/src/modules/auth/auth.controller.ts

  /api/v1/auth/logout:
    post:
      summary: Đăng xuất tài khoản
      description: Thực hiện đăng xuất người dùng, vô hiệu hóa token hiện tại (sẽ xử lý bằng Redis sau này).
      operationId: logout
      tags:
        - Auth
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                  message:
                    type: string
      x-implementation:
        filePath: apps/backend/src/modules/auth/auth.controller.ts

  /api/v1/admin/categories:
    get:
      summary: Lấy danh sách danh mục (Admin)
      description: Lấy danh sách danh mục có phân trang, tìm kiếm và lọc trạng thái.
      operationId: getAdminCategories
      tags:
        - Admin Categories
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: search
          in: query
          schema:
            type: string
        - name: isActive
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: OK
      x-implementation:
        filePath: apps/backend/src/modules/categories/admin-categories.controller.ts
    post:
      summary: Thêm mới danh mục
      description: Thêm mới một danh mục sản phẩm (Admin)
      operationId: createCategory
      tags:
        - Admin Categories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                slug:
                  type: string
                iconUrl:
                  type: string
                parentId:
                  type: string
                isActive:
                  type: boolean
                displayOrder:
                  type: integer
      responses:
        '201':
          description: Created
      x-implementation:
        filePath: apps/backend/src/modules/categories/admin-categories.controller.ts

  /api/v1/admin/categories/{id}:
    get:
      summary: Lấy chi tiết danh mục
      description: Trả về thông tin chi tiết một danh mục theo ID
      operationId: getCategoryById
      tags:
        - Admin Categories
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
      x-implementation:
        filePath: apps/backend/src/modules/categories/admin-categories.controller.ts
    put:
      summary: Cập nhật danh mục
      description: Cập nhật thông tin danh mục theo ID
      operationId: updateCategory
      tags:
        - Admin Categories
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: OK
      x-implementation:
        filePath: apps/backend/src/modules/categories/admin-categories.controller.ts
    delete:
      summary: Xóa danh mục
      description: Soft delete danh mục theo ID
      operationId: deleteCategory
      tags:
        - Admin Categories
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
      x-implementation:
        filePath: apps/backend/src/modules/categories/admin-categories.controller.ts

  /api/v1/cart:
    get:
      summary: Lấy thông tin giỏ hàng
      description: Lấy giỏ hàng của user hiện tại
      operationId: getCart
      tags:
        - Cart
      responses:
        '200':
          description: OK
      x-implementation:
        filePath: apps/backend/src/modules/cart/cart.controller.ts

  /api/v1/cart/items:
    post:
      summary: Thêm sản phẩm vào giỏ
      description: Thêm mới hoặc tăng số lượng sản phẩm trong giỏ hàng
      operationId: addItem
      tags:
        - Cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                productId:
                  type: string
                quantity:
                  type: integer
      responses:
        '200':
          description: OK
        '400':
          description: Số lượng vượt quá tồn kho
        '404':
          description: Sản phẩm không tồn tại
      x-implementation:
        filePath: apps/backend/src/modules/cart/cart.controller.ts

  /api/v1/cart/items/{productId}:
    put:
      summary: Cập nhật số lượng sản phẩm
      description: Thay đổi trực tiếp số lượng sản phẩm
      operationId: updateItem
      tags:
        - Cart
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity:
                  type: integer
      responses:
        '200':
          description: OK
      x-implementation:
        filePath: apps/backend/src/modules/cart/cart.controller.ts
    delete:
      summary: Xóa sản phẩm khỏi giỏ
      description: Xóa hoàn toàn một sản phẩm khỏi giỏ hàng
      operationId: removeItem
      tags:
        - Cart
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
      x-implementation:
        filePath: apps/backend/src/modules/cart/cart.controller.ts

  /api/v1/cart/sync:
    post:
      summary: Đồng bộ giỏ hàng
      description: Đồng bộ giỏ hàng từ Local Storage sau khi Guest đăng nhập
      operationId: syncCart
      tags:
        - Cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      productId:
                        type: string
                      quantity:
                        type: integer
      responses:
        '200':
          description: OK
      x-implementation:
        filePath: apps/backend/src/modules/cart/cart.controller.ts
